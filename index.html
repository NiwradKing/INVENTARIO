<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario - Bodega de Bebidas</title>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-wine-bottle"></i>
            <span>Bodega Control</span>
        </div>
        <div class="nav-stats">
            <div class="stat-pill">
                <span>Total Productos:</span>
                <strong id="stat-total-prod">0</strong>
            </div>
            <div class="stat-pill">
                <span>Stock Total:</span>
                <strong id="stat-total-stock">0</strong>
            </div>
            <div class="stat-pill highlight">
                <span>Valor Bodega:</span>
                <strong id="stat-total-val">$0</strong>
            </div>
        </div>
    </header>

    <main class="container">
        
        <!-- Panel Izquierdo: Formulario -->
        <section class="card form-card">
            <h2><i class="fa-solid fa-square-plus"></i> Registrar / Editar Bebida</h2>
            <form id="inventory-form">
                <input type="hidden" id="edit-id">
                
                <div class="form-group">
                    <label for="prod-name">Nombre de la Bebida</label>
                    <input type="text" id="prod-name" placeholder="Ej: Club Colombia 330ml" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="prod-category">Categoría</label>
                        <select id="prod-category" required>
                            <option value="Cervezas">Cervezas</option>
                            <option value="Gaseosas">Gaseosas</option>
                            <option value="Licores">Licores</option>
                            <option value="Aguas y Jugos">Aguas y Jugos</option>
                            <option value="Energizantes">Energizantes</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="prod-price">Precio Unitario (COP)</label>
                        <input type="number" id="prod-price" min="0" step="50" placeholder="Ej: 4500" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="prod-stock">Cantidad en Stock</label>
                    <input type="number" id="prod-stock" min="0" placeholder="Ej: 48" required>
                </div>

                <div class="form-actions">
                    <button type="submit" id="btn-save" class="btn btn-primary">
                        <i class="fa-solid fa-floppy-disk"></i> Guardar Producto
                    </button>
                    <button type="button" id="btn-cancel" class="btn btn-secondary" style="display: none;">
                        Cancelar
                    </button>
                </div>
            </form>
        </section>

        <!-- Panel Derecho: Tabla de Inventario -->
        <section class="card table-card">
            <div class="table-header">
                <h2><i class="fa-solid fa-boxes-stacked"></i> Existencias en Bodega</h2>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Buscar bebida...">
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Precio Unit.</th>
                            <th>Stock</th>
                            <th>Valor Total</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-tbody">
                        <!-- Se llena dinámicamente con JS -->
                    </tbody>
                </table>
            </div>
            
            <div id="empty-state" class="empty-state">
                <i class="fa-solid fa-box-open"></i>
                <p>No hay bebidas registradas en el inventario.</p>
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
